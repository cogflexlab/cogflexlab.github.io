# Book settings
title: "Cognitive Flexibility (CogFlex) Lab"
author: "CogFlex Lab"
url: "https://cogflexlab.github.io"

repository:
  url: https://github.com/cogflexlab/cogflexlab.github.io
  path_to_book: book
  branch: main

html:
  home_page_in_navbar: true
  extra_navbar: |
    <div>
      <strong>CogFlex Lab</strong><br>
      Understanding how minds change
    </div>

sphinx:
  extra_extensions:
    - sphinx_inline_tabs
  extra_footer: |
    <p>
      Cognitive Flexibility (CogFlex) Lab
    </p>
  config:
    html_show_copyright: false
    html_last_updated_fmt: "%Y-%m-%d (%H:%M %Z)"
    html_theme_options:
      use_download_button: false
    html_js_files:
      - custom.js
    html_css_files:
      - custom.css
